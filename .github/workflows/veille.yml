name: Veille programmes

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures
  workflow_dispatch:       # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Chercher les nouveaux programmes
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python scripts/veille.py

      - name: Enregistrer les changements
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data docs
          if ! git diff --staged --quiet; then
            git commit -m "Mise à jour de la veille"
            git push
          fi
